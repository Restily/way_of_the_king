[project]
name = "wotk"
version = "0.1.0"
description = "Way Of The King — backend (FastAPI + SQLAlchemy + aiogram + Arq)"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Cache & queue
    "redis>=5.2",
    "arq>=0.26",
    # Telegram
    "aiogram>=3.15",
    # TON
    "pytoniq>=0.1.40",
    "tonsdk>=1.0.15",
    # Crypto / auth
    "pyjwt>=2.10",
    "cryptography>=43.0",
    # Logging / observability
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "prometheus-fastapi-instrumentator>=7.0",
    # Game logic helpers
    "msgspec>=0.18",
    "numpy>=2.1",
    # Utilities
    "httpx>=0.28",
    "orjson>=3.10",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wotk"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "T20"
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
